[target.riscv64gc-unknown-openbsd]
rustflags = [
  "-Clink-arg=--sysroot=sysroot/openbsd/riscv64",
  "-Clink-arg=--target=riscv64gc--openbsd",
]

[target.riscv64gc-unknown-redox]
linker = "redox/riscv64gc-unknown-redox/bin/riscv64-unknown-redox-gcc"
rustflags = ["-Clink-arg=--sysroot=redox/riscv64gc-unknown-redox"]

[target.sparc64-unknown-netbsd]
linker = "sparc64-unknown-netbsd-gcc"

[target.sparc64-unknown-openbsd]
linker = "sparc64-unknown-openbsd-clang"
rustflags = ["-Clink-arg=-lc"]

[target.thumbv7neon-linux-androideabi]
linker = "ndk/bin/armv7a-linux-androideabi35-clang"

[target.wasm32-wali-linux-musl]
linker = "WALI/build/llvm/bin/clang"
rustflags = ["-LWALI/build/sysroot/lib", "-LWALI/build/libcxx/lib/", "-Ctarget-feature=+crt-static"]

[target.x86_64-linux-android]
linker = "ndk/bin/x86_64-linux-android35-clang"

[target.x86_64-oe-linux-gnu]
linker = "x86_64-poky-linux-gcc"
rustflags = ["-Clink-arg=--sysroot=sysroots/core2-64-poky-linux"]

[target.x86_64-unknown-dragonfly]
rustflags = [
  "-Clink-arg=--sysroot=sysroot/dfly",
  "-Clink-arg=--target=x86_64--dragonfly",
]

[target.x86_64-unknown-freebsd]
runner = "qemu-x86_64 -L sysroot/freebsd/amd64"
rustflags = [
  "-Clink-arg=--sysroot=sysroot/freebsd/amd64",
  "-Clink-arg=--target=x86_64--freebsd",
]

[target.x86_64-unknown-fuchsia]
rustflags = [
  "-Clink-arg=--target=x86_64--fuchsia",
  "-Clink-arg=--sysroot=fuchsia/arch/x64/sysroot",
  "-Lnative=fuchsia/arch/x64/lib",
]

[target.x86_64-unknown-haiku]
linker = "haiku/bin/x86_64-unknown-haiku-gcc"

[target.x86_64-unknown-linux-ohos]
rustflags = ["-Clink-arg=--target=x86_64--linux-ohos"]

[target.x86_64-unknown-netbsd]
rustflags = [
  "-Clink-arg=--sysroot=sysroot/netbsd/amd64",
  "-Clink-arg=--target=x86_64--netbsd",
]

[target.x86_64-unknown-openbsd]
rustflags = [
  "-Clink-arg=--sysroot=sysroot/openbsd/amd64",
  "-Clink-arg=--target=x86_64--openbsd",
]

[target.x86_64-unknown-redox]
linker = "redox/x86_64-unknown-redox/bin/x86_64-unknown-redox-gcc"
rustflags = ["-Clink-arg=--sysroot=redox/x86_64-unknown-redox"]

[target.x86_64-uwp-windows-gnu]
linker = "C:\\msys64\\mingw64\\bin\\gcc.exe"
rustflags = ["-lgcc_eh"]

[term]
color = "always"
# progress.when = "auto"
# quiet=true

[host]
rustflags = ["-Ctarget-cpu=native", "-Ztune-cpu=native", "-Cprefer-dynamic"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = [
  "--no-deps",
  "--cfg",
  "docsrs",
  "--playground-url",
  "https://play.rust-lang.org",
]

[unstable]
any-build-script-metadata = true
avoid-dev-deps = true
binary-dep-depinfo = true
bindeps = true
build-dir-new-layout = true
checksum-freshness = true
codegen-backend = true
embed-metadata = false
feature-unification = true
fine-grain-locking = true
gc = true
git = { shallow_index = true, shallow_deps = true }
gitoxide = { fetch = true, checkout = true, internal_use_git2 = true }
host-config = true
json-target-spec = true
panic-abort-tests = true
panic-immediate-abort = true
profile-hint-mostly-unused = true
profile-rustflags = true
public-dependency = true
rustc-unicode = true
rustdoc-depinfo = true
rustdoc-mergeable-info = true
script = true
target-applies-to-host = true
# build-std = ["std", "panic_abort"]
# build-std-features = ["optimize_for_size"]
unstable-options = true
prerelease = true
