[alias]
ad = "add --no-default-features --optional"
bi = "binstall --disable-telemetry"
br = "b -r"
d = "rustdoc"
gl = "generate-lockfile"
rr = "r -r"

cf = "clippy --fix --allow-no-vcs --no-deps"
fx = "fix --allow-no-vcs"
mt = "miri test -- --exact --nocapture"

all = "r --all-features"
ndf = "r --no-default-features"

md = "metadata --no-deps --format-version 1"
ta = "t -- --nocapture"
ti = "t -- --exact --nocapture"
tn = "tree -e normal"

l = "b --profile lto"
no = "c --profile no"

e = "s arm64e-apple-darwin"
h = "s x86_64h-apple-darwin"
s = "b --profile src -Zbuild-std=std,panic_abort --target"
slib = "rustc --lib --crate-type=staticlib -- -Zstaticlib-hide-internal-symbols -Zstaticlib-rename-internal-symbols"
z = "zigbuild --profile src -Zbuild-std=std,panic_abort --target"

[build]
build-dir = "build-dir"
rustflags = ["-Zpanic-in-drop=abort"]
rustdocflags = [
  "-Zunstable-options",
  "--no-deps",
  "--generate-link-to-definition",
  "--document-hidden-items",
  "--document-private-items",
  "--default-theme dark",
  "--all-features",
]
incremental = true
# target-dir = "target-dir"
# compiler-docs = true
# rustc-wrapper = "sccache"
# rustc-workspace-wrapper = "sccache"

[cargo-new]
vcs = "none"

[env]
CARGO_LOG = "off"
CFLAGS = { value = "-O3 -flto -fomit-frame-pointer -fno-unwind-tables -fno-asynchronous-unwind-tables -pipe -g0 -fvisibility=hidden", force = true }
CPPFLAGS = { value = "-DNDEBUG", force = true }
CXXFLAGS = { value = "-O3 -flto -fomit-frame-pointer -fno-unwind-tables -fno-asynchronous-unwind-tables -pipe -g0 -fvisibility=hidden -fvisibility-inlines-hidden -fno-exceptions -fno-rtti", force = true }
LDFLAGS = { value = "-Wl,-O3 -Wl,--gc-sections", force = true }
MIRIFLAGS = "-Zmiri-disable-isolation"
RUSTC_BOOTSTRAP = "1"
RUSTC_ICE = "0"
RUSTC_LOG = "off"
RUSTDOC_LOG = "off"
RUST_BACKTRACE = "0"
RUST_LIB_BACKTRACE = "0"
RUST_PANIC_STRATEGY = "abort"
# RUST_TEST_NOCAPTURE = "1"
# SCCACHE_DIRECT = "true"
# SCCACHE_RECACHE = "true"

[rust]
lld = true
new-symbol-mangling = true

[net]
# offline = true

[lints]
workspace = true

[lints.rust]

[lints.rustdoc]

[lints.clippy]

[lints.cargo]
# build-std = [
#     "core",
#     "std",
#     "alloc",
#     "proc_macro",
#     "panic_abort",
#     "panic_unwind",
#     "libc",
#     "compiler_builtins",
# ]
# build-std-features = ["force_alloc_jemalloc","threads"]

# dev
[profile.dev]
opt-level = "s"
debug = false
strip = true
rpath = true
rustflags = ["-Cprefer-dynamic", "-Cdebug-assertions"]
trim-paths = "all"
# hint-mostly-unused = true

[profile.dev.build-override]
rustflags = ["-Cprefer-dynamic"]
inherits = "dev"

[profile.dev.package."*"]
debug-assertions = false
inherits = "dev"
rustflags = ["-Cprefer-dynamic"]

# release
[profile.release]
strip = true
rpath = true
rustflags = ["-Cprefer-dynamic"]
trim-paths = "all"
# hint-mostly-unused = true

[profile.release.build-override]
rustflags = ["-Cprefer-dynamic"]
inherits = "release"

[profile.release.package."*"]
rustflags = ["-Cprefer-dynamic"]
inherits = "release"

# test
[profile.test]
rustflags = ["-Cprefer-dynamic", "-Cdebug-assertions"]
inherits = "dev"

[profile.test.build-override]
rustflags = ["-Cprefer-dynamic"]
inherits = "dev"

[profile.test.package."*"]
rustflags = ["-Cprefer-dynamic"]
inherits = "dev"

# bench
[profile.bench]
rustflags = ["-Cprefer-dynamic", "-Cdebug-assertions"]
inherits = "dev"

[profile.bench.build-override]
rustflags = ["-Cprefer-dynamic"]
inherits = "dev"

[profile.bench.package."*"]
rustflags = ["-Cprefer-dynamic"]
inherits = "dev"

# lto
[profile.lto]
inherits = "release"
lto = true
panic = "abort"
codegen-units = 1
rustflags = [
  "-Zlocation-detail=none",
  "-Ztrap-unreachable=no",
  # "-Zvirtual-function-elimination",
]

[profile.lto.build-override]
inherits = "lto"
rustflags = [
  "-Cprefer-dynamic",
  "-Zlocation-detail=none",
  "-Ztrap-unreachable=no",
]

[profile.lto.package."*"]
inherits = "lto"
rustflags = [
  "-Cprefer-dynamic",
  "-Zlocation-detail=none",
  "-Ztrap-unreachable=no",
]

# NO
[profile.no]
inherits = "dev"
debug-assertions = false
rustflags = [
  "-Cprefer-dynamic",
  "-Zlocation-detail=none",
  "-Zno-analysis",
  "-Zno-codegen",
  "-Zno-link",
  "-Zparse-crate-root-only",
  "-Ztrap-unreachable=no",
  "-Dunused_crate_dependencies",
  "-Dunused_extern_crates",
  "-Dclippy::redundant_pub_crate",
]

[profile.no.build-override]
rustflags = [
  "-Cprefer-dynamic",
  "-Zlocation-detail=none",
  "-Ztrap-unreachable=no",
  "-Dunused_crate_dependencies",
  "-Dunused_extern_crates",
  "-Dclippy::redundant_pub_crate",
]
inherits = "no"

[profile.no.package."*"]
rustflags = [
  "-Cprefer-dynamic",
  "-Zlocation-detail=none",
  "-Ztrap-unreachable=no",
  "-Dunused_crate_dependencies",
  "-Dunused_extern_crates",
  "-Dclippy::redundant_pub_crate",
]
inherits = "no"

# src
[profile.src]
inherits = "lto"
panic = "immediate-abort"
rustflags = [
  "-Zforce-unstable-if-unmarked",
  "-Zlocation-detail=none",
  "-Ztrap-unreachable=no",
  # "-Zcross-crate-inline-threshold=yes",
]

[profile.src.build-override]
inherits = "src"
rustflags = [
  "-Cprefer-dynamic",
  "-Zlocation-detail=none",
  "-Ztrap-unreachable=no",
]

[profile.src.package."*"]
inherits = "src"
rustflags = [
  "-Cprefer-dynamic",
  "-Zlocation-detail=none",
  "-Ztrap-unreachable=no",
]

