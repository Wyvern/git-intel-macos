name: Git

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

jobs:
  macOS:
    name: Git-macOS-Intel
    runs-on: macos-26

    permissions:
      contents: write

    steps:
      - name: Disable macos spotlight index
        run: |
          sudo mdutil -a -i off
          sudo mdutil -a -d
          sudo pmset -a powernap 0
          sudo pmset -a sleep 0

      - name: Checkout
        uses: actions/checkout@v7

      - name: Checkout git_osx_installer
        uses: actions/checkout@v4
        with:
          repository: MoravianUniversity/git_osx_installer
          path: git_osx_installer
          fetch-depth: 1

      - name: Show build environment
        working-directory: git_osx_installer
        run: |
          set -euxo pipefail

          uname -a
          uname -m
          clang --version
          make --version
          xcode-select -p

      - name: Patch for Intel x86_64
        working-directory: git_osx_installer
        run: |
          set -euxo pipefail

          python3 <<'PY'
          from pathlib import Path

          path = Path("Makefile")
          text = path.read_text()

          replacements = {
              "ARCH_FLAGS := -target arm64-apple-macos11":
                  """ARCH_FLAGS := -target x86_64-apple-macos11

          CFLAGS := $(ARCH_FLAGS) \\
              -O3 \\
              -flto=thin \\
              -ffunction-sections \\
              -fdata-sections \\
              -fno-ident \\
              -march=haswell \\
              -pipe

          CXXFLAGS := $(ARCH_FLAGS) \\
              -O3 \\
              -flto=thin \\
              -ffunction-sections \\
              -fdata-sections \\
              -fno-ident \\
              -march=haswell \\
              -pipe

          LDFLAGS := $(ARCH_FLAGS) \\
              -O3 \\
              -flto=thin \\
              -march=haswell \\
              -Wl,-dead_strip \\
              -Wl,-dead_strip_dylibs""",

              "DESTDIR_arm := $(PWD)/stage-arm/":
                  "DESTDIR_x86_64 := $(PWD)/stage-x86_64/",

              "git-arm":
                  "git-x86_64",

              "osx-staged-arm":
                  "osx-staged-x86_64",

              "osx-compiled-arm":
                  "osx-compiled-x86_64",

              "Mach-O 64-bit executable arm64":
                  "Mach-O 64-bit executable x86_64",
          }

          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(
                      f"ERROR: Makefile pattern not found: {old!r}"
                  )

              text = text.replace(old, new)

          # Replace every remaining ARM staging-directory reference.
          text = text.replace(
              "$(DESTDIR_arm)",
              "$(DESTDIR_x86_64)",
          )

          # Remove upstream standalone assignments that would override
          # the optimized definitions above.
          text = text.replace(
              "CFLAGS := $(ARCH_FLAGS)\n",
              "",
          )

          text = text.replace(
              "LDFLAGS := $(ARCH_FLAGS)\n",
              "",
          )

          # Pass CXXFLAGS into the nested Git build too.
          old = 'CFLAGS="$(CFLAGS)" LDFLAGS="$(LDFLAGS)"'
          new = 'CFLAGS="$(CFLAGS)" CXXFLAGS="$(CXXFLAGS)" LDFLAGS="$(LDFLAGS)"'

          if old not in text:
              raise SystemExit(
                  f"ERROR: SUBMAKE flags pattern not found: {old!r}"
              )

          text = text.replace(old, new)

          path.write_text(text)
          PY

          echo
          echo "===== Patched Makefile ====="
          echo

          grep -nE \
            'ARCH_FLAGS|^CFLAGS|^CXXFLAGS|^LDFLAGS|DESTDIR_|^SUBMAKE|git-x86_64|staged-x86_64|compiled-x86_64|Mach-O' \
            Makefile

      - name: Configure Rust for Intel
        run: |
          set -euxo pipefail
          rustup target add x86_64-apple-darwin
          echo "CARGO_BUILD_TARGET=x86_64-apple-darwin" >> "$GITHUB_ENV"
          echo "MACOSX_DEPLOYMENT_TARGET=11.0" >> "$GITHUB_ENV"
          echo "RUSTFLAGS=-C target-cpu=haswell" >> "$GITHUB_ENV"

      - name: Prepare Git source
        working-directory: git_osx_installer
        run: |
          set -euxo pipefail

          make download
          make build/git-x86_64/Makefile

          python3 - <<'PY'
          from pathlib import Path

          p = Path("build/git-x86_64/Makefile")
          s = p.read_text()

          old = """RUST_LIB = target/$(RUST_BUILD_CONFIG)/$(RUST_LIB_NAME)"""

          new = """RUST_LIB = target/$(RUST_BUILD_CONFIG)/$(RUST_LIB_NAME)

          RUST_CARGO_LIB = target/$(RUST_BUILD_CONFIG)/x86_64-apple-darwin/$(RUST_LIB_NAME)"""

          if old not in s:
              raise SystemExit("RUST_LIB definition not found")

          s = s.replace(old, new, 1)

          old = """$(RUST_LIB): Cargo.toml $(RUST_SOURCES) $(LIB_FILE)
          $(QUIET_CARGO)cargo build $(CARGO_ARGS)"""

          new = """$(RUST_LIB): $(RUST_CARGO_LIB)
          $(QUIET)mkdir -p $(dir $@)
          $(QUIET)cp $< $@

          $(RUST_CARGO_LIB): Cargo.toml $(RUST_SOURCES) $(LIB_FILE)
          $(QUIET_CARGO)cargo build $(CARGO_ARGS) --target x86_64-apple-darwin"""

          if old not in s:
              raise SystemExit("Rust Make rule not found")

          s = s.replace(old, new, 1)

          p.write_text(s)
          PY

          grep -n -A12 -B5 'RUST_CARGO_LIB' build/git-x86_64/Makefile

      - name: Build Release
        working-directory: git_osx_installer
        env:
          MACOSX_DEPLOYMENT_TARGET: '11.0'
        run: |
          set -euxo pipefail

          make clean || true

          rm -rf \
            build \
            stage-x86_64 \
            git-*.pkg

          make package

          echo
          echo "===== Built packages ====="
          echo

          ls -lh git-*.pkg

          sw_vers
          hostinfo
          sysctl -n machdep.cpu.brand_string

      - name: Determine package
        id: package
        working-directory: git_osx_installer
        run: |
          set -euo pipefail

          pkg="$(
            find . \
              -maxdepth 1 \
              -name 'git-*.pkg' \
              -type f \
              -print \
              -quit
          )"

          if [[ -z "$pkg" ]]; then
            echo "ERROR: package not found"
            exit 1
          fi

          pkg="${pkg#./}"

          version="${pkg#git-}"
          version="${version%.pkg}"

          echo "file=$pkg" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          echo
          echo "Package: $pkg"
          echo "Git version: $version"

      - name: Upload Git installer
        uses: actions/upload-artifact@v7
        with:
          name: git-macos-x86_64
          path: git_osx_installer/git-*.pkg
          if-no-files-found: error

      - name: Upload package to GitHub Release
        working-directory: git_osx_installer
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euxo pipefail

          pkg="${{ steps.package.outputs.file }}"

          echo
          echo "Release tag: $RELEASE_TAG"
          echo "Package:     $pkg"
          echo

          gh release upload \
            "$RELEASE_TAG" \
            "$pkg" \
            --repo "${{ github.repository }}" \
            --clobber
