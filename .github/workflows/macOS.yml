name: Git

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

jobs:
  macOS:
    name: Git-macOS-Intel
    runs-on: macos-26

    permissions:
      contents: write

    steps:
      - name: Disable macos spotlight index
        run: |
          sudo mdutil -a -i off
          sudo mdutil -a -d
          sudo pmset -a powernap 0
          sudo pmset -a sleep 0

      - name: Checkout
        uses: actions/checkout@v7

      - name: Checkout git_osx_installer
        uses: actions/checkout@v4
        with:
          repository: MoravianUniversity/git_osx_installer
          path: git_osx_installer
          fetch-depth: 1

      - name: Show build environment
        working-directory: git_osx_installer
        run: |
          set -euxo pipefail

          uname -a
          uname -m
          clang --version
          make --version
          xcode-select -p

      - name: Patch for Intel x86_64
        working-directory: git_osx_installer
        run: |
          set -euxo pipefail

          python3 <<'PY'
          from pathlib import Path

          path = Path("Makefile")
          text = path.read_text()

          replacements = {
              "ARCH_FLAGS := -target arm64-apple-macos11":
                  """ARCH_FLAGS := -target x86_64-apple-macos11

          CFLAGS := $(ARCH_FLAGS) \\
              -O3 \\
              -flto=thin \\
              -ffunction-sections \\
              -fdata-sections \\
              -fno-ident \\
              -march=haswell \\
              -pipe

          CXXFLAGS := $(ARCH_FLAGS) \\
              -O3 \\
              -flto=thin \\
              -ffunction-sections \\
              -fdata-sections \\
              -fno-ident \\
              -march=haswell \\
              -pipe

          LDFLAGS := $(ARCH_FLAGS) \\
              -O3 \\
              -flto=thin \\
              -march=haswell \\
              -Wl,-dead_strip \\
              -Wl,-dead_strip_dylibs""",

              "DESTDIR_arm := $(PWD)/stage-arm/":
                  "DESTDIR_x86_64 := $(PWD)/stage-x86_64/",

              "git-arm":
                  "git-x86_64",

              "osx-staged-arm":
                  "osx-staged-x86_64",

              "osx-compiled-arm":
                  "osx-compiled-x86_64",

              "Mach-O 64-bit executable arm64":
                  "Mach-O 64-bit executable x86_64",
          }

          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(
                      f"ERROR: Makefile pattern not found: {old!r}"
                  )

              text = text.replace(old, new)

          # The upstream Makefile uses DESTDIR_arm everywhere.
          # Rename all remaining references to the Intel staging directory.
          text = text.replace(
              "$(DESTDIR_arm)",
              "$(DESTDIR_x86_64)",
          )

          # Remove the original upstream assignments.
          # The optimized definitions above are multiline and therefore
          # do not match these standalone lines.
          text = text.replace(
              "CFLAGS := $(ARCH_FLAGS)\n",
              "",
          )

          text = text.replace(
              "LDFLAGS := $(ARCH_FLAGS)\n",
              "",
          )

          path.write_text(text)
          PY

          echo
          echo "===== Patched Makefile ====="
          echo

          grep -nE \
            'ARCH_FLAGS|^CFLAGS|^CXXFLAGS|^LDFLAGS|DESTDIR_|^SUBMAKE|git-x86_64|staged-x86_64|compiled-x86_64|Mach-O' \
            Makefile

      - name: Build Release
        working-directory: git_osx_installer
        env:
          MACOSX_DEPLOYMENT_TARGET: '11.0'
        run: |
          set -euxo pipefail

          make clean || true

          rm -rf \
            build \
            stage-x86_64 \
            git-*.pkg

          make package

          echo
          echo "===== Built packages ====="
          echo

          ls -lh git-*.pkg

          sw_vers
          hostinfo
          sysctl -n machdep.cpu.brand_string

      - name: Determine package
        id: package
        working-directory: git_osx_installer
        run: |
          set -euo pipefail

          pkg="$(
            find . \
              -maxdepth 1 \
              -name 'git-*.pkg' \
              -type f \
              -print \
              -quit
          )"

          if [[ -z "$pkg" ]]; then
            echo "ERROR: package not found"
            exit 1
          fi

          pkg="${pkg#./}"

          version="${pkg#git-}"
          version="${version%.pkg}"

          echo "file=$pkg" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          echo
          echo "Package: $pkg"
          echo "Git version: $version"

      - name: Upload Git installer
        uses: actions/upload-artifact@v7
        with:
          name: git-macos-x86_64
          path: git_osx_installer/git-*.pkg
          if-no-files-found: error

      - name: Upload package to GitHub Release
        working-directory: git_osx_installer
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euxo pipefail

          pkg="${{ steps.package.outputs.file }}"

          echo
          echo "Release tag: $RELEASE_TAG"
          echo "Package:     $pkg"
          echo

          gh release upload \
            "$RELEASE_TAG" \
            "$pkg" \
            --repo "${{ github.repository }}" \
            --clobber
